<div class="flex flex-col min-h-[calc(100vh-100px)] relative" >
  <h2 class="text-2xl font-semibold mb-4">Edit Designation Name</h2>

  <form [formGroup]="designationForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-1" >
    <div class="flex-1 pb-24" >
        <div class="grid grid-cols-2 gap-x-20 gap-y-6">
            <app-form-input
                formControlName="designationName"
                label="Designation Name"
                type="text"
                placeholder="Enter designation name"
                [required]="true"
                [control]="designationForm.get('designationName')"
            ></app-form-input>

            <app-form-input
                formControlName="description"
                label="Description"
                type="text"
                placeholder="Enter designation description"
                [required]="true"
                [control]="designationForm.get('description')"
            ></app-form-input>
            </div>
    </div>
   

     <div class="sticky bottom-0  left-0 right-0 bg-white pb-14 flex justify-center gap-3 backdrop-blur-sm bg-white/90 border-t border-gray-50">
      <button 
        type="button"
        (click)="cancel()"
        class="px-6 w-52 py-2 border border-gray-300 font-medium rounded-full text-white bg-red-500 hover:bg-red-600 transition-colors shadow-sm">
        Cancel
      </button>
      
      <button 
        type="submit"
        [disabled]="submitting || designationForm.invalid"
        class="px-4 py-2 w-52 bg-green-500 text-white font-medium rounded-full hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm shadow-green-200">
        <span class="flex items-center justify-center gap-2">
            <span *ngIf="submitting" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ submitting ? 'Saving...' : 'Save' }}
        </span>
      </button>
    </div>
  </form>
</div>
