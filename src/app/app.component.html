<!-- src/app/app.component.html -->
<div class="flex min-h-screen bg-white">
  
  <!-- Desktop Sidebar -->
  <app-sidebar (closeSidebar)="closeMobileSidebar()"></app-sidebar>
  
  <!-- Main Content -->
  <main class="flex-1 lg:ml-64">
    
    <!-- Header -->
    <app-header (toggleMobileMenu)="toggleMobileSidebar()"></app-header>
    
    <!-- Page Content -->
    <div class="p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Mobile Sidebar (separate component instance for mobile) -->
<div 
  *ngIf="isMobileSidebarOpen"
  class="fixed inset-0 bg-black/50 z-40 lg:hidden"
  (click)="closeMobileSidebar()">
</div>
