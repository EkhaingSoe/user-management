<!-- src/app/shared/components/form-select/form-select.component.html -->
<div class="form-group flex flex-col " [class.has-error]="hasError()">
  <label  class="form-label font-medium text-gray-700 mb-1">
    {{ label }}
    <span *ngIf="required" class="required-star">*</span>
  </label>
  
  <select 
    [value]="value"
    (change)="onSelect($event)"
    (blur)="onBlur()"
    [disabled]="disabled"
    class="form-control bg-green-50 py-2 px-3 rounded-lg border border-gray-300 outline-none"
    [class.error]="hasError()">
    
    <option value="" disabled>{{ placeholder }}</option>
    <option *ngFor="let opt of options" [value]="opt.value">
      {{ opt.label }}
    </option>
  </select>
  
  <div *ngIf="hasError()" class="error-message">
    {{ label }} is required
  </div>
</div>
