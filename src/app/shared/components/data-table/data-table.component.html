
<div class="bg-white  overflow-hidden">

  <div *ngIf="loading" class="flex flex-col items-center justify-center py-16">
    <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
    <p class="mt-4 text-gray-500">Loading data...</p>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto" [class.opacity-50]="loading">
    <table class="min-w-full border-separate border-spacing-y-2">
      <thead class="bg-green-50 ">
        <tr>
          <th *ngFor="let col of columns" 
              [style.width]="col.width"
              (click)="col.sortable && onSort(col.key)"
              class="px-4 py-3 text-sm whitespace-nowrap text-left font-semibold text-gray-600 uppercase  cursor-pointer ">
            {{ col.label }}
          </th>
          <th *ngIf="actions.length > 0" class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 space-y-2 bg-green-50 ">
       <tr
            *ngFor="let row of paginatedData; let idx = index"
            class="hover:bg-gray-50/50 bg-text-50  transition-colors">

            <!-- Dynamic Columns -->
            <td
                *ngFor="let col of columns"
                class="px-4 py-3 whitespace-nowrap bg-text-50 text-sm text-gray-700">

                {{ row[col.key] }}

            </td>

            <!-- Actions -->
            <td
                *ngIf="actions.length > 0"
                class="px-4 py-3 whitespace-nowrap">

                <div class="flex items-center gap-1">

                <button
                    *ngFor="let action of actions"
                    (click)="onAction(action.action, row)"
                    class="p-1.5 rounded-md transition-colors"
                    [ngClass]="{
                    'text-blue-500 hover:bg-blue-50': action.action === 'view',
                    'text-green-500 hover:bg-green-50': action.action === 'edit',
                    'text-red-500 hover:bg-red-50': action.action === 'delete'
                    }"
                    [title]="action.label">
                    <span>{{ action.label}}</span>

                    <!-- <span>{{ action.icon }}</span> -->

                </button>

                </div>

            </td>

            </tr>
        
        <tr *ngIf="paginatedData.length === 0 && !loading">
          <td [attr.colspan]="columns.length + (actions.length > 0 ? 1 : 0)" class="px-4 py-12 text-center">
            <div class="flex flex-col items-center">
              <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
              </svg>
              <p class="text-gray-500">No data available</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div *ngIf="showPagination && totalPages > 1" class="flex  bg-green-50 justify-between items-center px-4 py-3 border-t border-gray-100 bg-gray-50/50">
    <div class="text-sm text-gray-500">
      Page {{ currentPage }} of {{ totalPages }}
        
    </div>
    <div class="flex gap-1">
      <button (click)="onPageChange(1)" [disabled]="currentPage === 1" 
              class="px-3 py-1 rounded-md text-sm border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        «
      </button>
      <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
              class="px-3 py-1 rounded-md text-sm border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        ‹
      </button>
      
      <div class="flex gap-1">
        <button *ngFor="let page of [].constructor(totalPages); let i = index"
                (click)="onPageChange(i + 1)"
                class="px-3 py-1 rounded-md text-sm transition-colors"
                [class.bg-blue-600]="currentPage === i + 1"
                [class.text-white]="currentPage === i + 1"
                [class.border]="currentPage !== i + 1"
                [class.border-gray-300]="currentPage !== i + 1"
                [class.text-gray-600]="currentPage !== i + 1"
                [class.hover:bg-gray-50]="currentPage !== i + 1">
          {{ i + 1 }}
        </button>
      </div>
      
      <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages"
              class="px-3 py-1 rounded-md text-sm border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        ›
      </button>
      <button (click)="onPageChange(totalPages)" [disabled]="currentPage === totalPages"
              class="px-3 py-1 rounded-md text-sm border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        »
      </button>
    </div>
  </div>
</div>
