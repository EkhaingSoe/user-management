<!-- src/app/shared/components/form-input/form-input.component.html -->
<div class="form-group flex flex-col" [class.has-error]="hasError()">
  <label class="form-label font-medium text-gray-700 mb-1">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>
  
  <!-- Textarea -->
  <textarea *ngIf="type === 'textarea'"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [placeholder]="placeholder"
    [readonly]="readonly"
    [disabled]="disabled"
    [rows]="rows"
    class="form-control"
    [class.error]="hasError()">
  </textarea>
  
  <!-- Input -->
  <input *ngIf="type !== 'textarea'"
    [type]="type"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [placeholder]="placeholder"
    [readonly]="readonly"
    [disabled]="disabled"
    [min]="min"
    [max]="max"
    class="form-control bg-green-50 py-2 px-3 rounded-lg border border-gray-300 outline-none"
    [class.error]="hasError()">
  
  <div *ngIf="hasError()" class="text-red-500 text-xs ps-2 mt-1">
    {{ getErrorMessage() }}
  </div>
  
  <div *ngIf="control?.pending" class="pending-message">
    Validating...
  </div>
</div>
